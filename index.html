  header{text-align:center;margin-bottom:22px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 18px}
  .leaf{font-size:38px;line-height:1}
  h1{font-family:Fraunces,Georgia,serif;font-weight:700;font-size:clamp(30px,7vw,44px);margin:6px 0 4px;letter-spacing:-.01em}
  .sub{color:var(--muted);margin:0}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:18px;box-shadow:0 2px 10px rgba(90,50,20,.06)}
  h2{font-family:Fraunces,Georgia,serif;font-weight:500;font-size:22px;margin:0 0 14px}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{background:var(--soft);border-radius:999px;padding:6px 12px;font-size:14px;display:flex;gap:6px;align-items:center}
  .chip b{font-weight:600}
  .chip.zero{opacity:.55}
  form{display:grid;gap:12px}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media (max-width:520px){.row{grid-template-columns:1fr}}
  label{display:grid;gap:5px;font-size:14px;font-weight:500}
  label span.opt{color:var(--muted);font-weight:400}
  input,select{font:inherit;font-size:16px;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:12px;padding:12px 13px;width:100%;-webkit-appearance:none;appearance:none}
  select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 52%,calc(100% - 13px) 52%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
  input:focus,select:focus{outline:2px solid var(--gold);outline-offset:1px;border-color:transparent}
  button{font:inherit;cursor:pointer;border:0;border-radius:12px}
  .primary{background:var(--accent);color:var(--accent-ink);font-weight:600;padding:14px;font-size:16px}
  .primary:disabled{opacity:.55;cursor:default}
  .hint{font-size:14px;color:var(--gold);margin:-4px 0 0}
  .hint:empty{display:none}
  .msg{font-size:14px;color:var(--muted);text-align:center;margin:0}
  .msg:empty{display:none}
  .msg.ok{color:var(--ok)} .msg.err{color:var(--accent)}
  .group{margin-top:16px} .group:first-child{margin-top:0}
  .group h3{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 6px;font-weight:600}
  .item{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
  .group .item:first-of-type{border-top:0;padding-top:4px}
  .item .main{flex:1;min-width:0}
  .dish{font-weight:600;overflow-wrap:anywhere}
  .who{color:var(--muted);font-size:14px;overflow-wrap:anywhere}
  .note{font-size:14px;margin-top:3px;overflow-wrap:anywhere}
  .rm{background:transparent;color:var(--muted);font-size:13px;padding:6px 8px;text-decoration:underline}
  .empty{color:var(--muted);text-align:center;padding:10px 0;margin:0}
  .setup{background:#fff3cd;border:1px solid #e9cf7a;border-radius:12px;padding:12px;font-size:14px}
  footer{text-align:center;font-size:13px;color:var(--muted);background:var(--card);border-radius:12px;padding:10px}

<div class="wrap">
  <header>
    <div class="leaf" aria-hidden="true">🦃</div>
    <h1>Friendsgiving</h1>
    <p class="sub">Add what you're bringing and see what everyone else has covered.</p>
  </header>

  <section class="card">
    <h2>What's covered so far</h2>
    <div class="chips" id="chips"></div>

  <section class="card">
    <h2>I'm bringing...</h2>
    <div id="setup"></div>
    <form id="form">
      <div class="row">
        <label>Your name

        </label>
        <label>Category
          <select id="category" required></select>
        </label>
      </div>
      <label>What exactly?
        <input id="dish" autocomplete="off" maxlength="80" required placeholder="e.g. Mac and cheese">
      </label>
      <p class="hint" id="dupe" aria-live="polite"></p>
      <button class="primary" id="submit" type="submit">Add to the list</button>
      <p class="msg" id="formMsg" aria-live="polite"></p>
    </form>
  </section>

  <section class="card">
    <h2>Everyone's list</h2>
    <div id="list"><p class="empty">Loading the list...</p></div>
  </section>

  <footer>Made a mistake? Tap "Remove" on your own entry, from the same phone you used to add it.</footer>

/* ================== PASTE YOUR SUPABASE VALUES HERE ================== */
const SUPABASE_URL = "https://hlaaxqwnoeuilmfyugkz.supabase.co";        // e.g. https://abcdefgh.supabase.co
const SUPABASE_KEY = "sb_publishable_KPDpUb5WizWo-OHxz7QsPw_4lfQXh6B";    // the Publishable key (sb_publishable_...) or legacy anon key. NEVER the secret key.
/* ===================================================================== */

const CATS = ["Appetizer","Main","Side","Dessert","Drinks","Supplies","Other"];
const COLS = "id,created_at,guest,dish,category,serves,notes";
const $ = id => document.getElementById(id);
const configured = /^https?:\/\/.+/.test(SUPABASE_URL) && !SUPABASE_KEY.startsWith("PASTE");
const API = SUPABASE_URL.replace(/\/+$/, "") + "/rest/v1";
const HEADERS = { "apikey": SUPABASE_KEY, "Content-Type": "application/json" };

let items = [], loaded = false, busy = false;

// --- small device-local helpers (this phone only) ---
function lsGet(k, d){ try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch(e){ return d; } }
function lsSet(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
function uuid(){
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  const b = crypto.getRandomValues(new Uint8Array(16)); b[6] = (b[6] & 15) | 64; b[8] = (b[8] & 63) | 128;
  const h = [...b].map(x => x.toString(16).padStart(2, "0")).join("");
  return `${h.slice(0,8)}-${h.slice(8,12)}-${h.slice(12,16)}-${h.slice(16,20)}-${h.slice(20)}`;
}
let token = lsGet("tg-token", null); if (!token) { token = uuid(); lsSet("tg-token", token); }
let mine = new Set(lsGet("tg-mine", []));
const savedName = lsGet("tg-name", ""); if (savedName) $("guest").value = savedName;

for (const c of CATS) { const o = document.createElement("option"); o.value = c; o.textContent = c; $("category").appendChild(o); }

function clean(s, max){ return String(s || "").replace(/\s+/g, " ").trim().slice(0, max); }
function el(tag, cls, text){ const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }

function renderChips(){
  const box = $("chips"); box.replaceChildren();
  for (const c of CATS) {
    const n = items.filter(i => i.category === c).length;
    const chip = el("div", "chip" + (n ? "" : " zero"));
    chip.append(el("span", "", c), el("b", "", String(n)));
    box.appendChild(chip);
  }
}

function renderList(statusText){
  const box = $("list"); box.replaceChildren();
  if (!loaded) { box.appendChild(el("p", "empty", statusText || "Loading the list...")); return; }
  if (!items.length) { box.appendChild(el("p", "empty", "Nobody has signed up yet. Be the first!")); return; }
  for (const c of CATS) {
    const group = items.filter(i => i.category === c);
    if (!group.length) continue;
    const g = el("div", "group"); g.appendChild(el("h3", "", c));
    for (const it of group) {
      const row = el("div", "item"), main = el("div", "main");
      main.appendChild(el("div", "dish", it.dish));
      main.appendChild(el("div", "who", it.guest + (it.serves ? " · serves " + it.serves : "")));
      if (it.notes) main.appendChild(el("div", "note", it.notes));
      row.appendChild(main);
      if (mine.has(it.id)) {
        const rm = el("button", "rm", "Remove"); rm.type = "button";
        rm.addEventListener("click", () => removeItem(it.id, rm));
        row.appendChild(rm);
      }
      g.appendChild(row);
    }
    box.appendChild(g);
  }
}

function checkDupe(){
  const v = clean($("dish").value, 80).toLowerCase(), hint = $("dupe");
  if (v.length < 3) { hint.textContent = ""; return; }
  const hit = items.find(i => (i.dish || "").toLowerCase() === v);
  hint.textContent = hit ? "Heads up: " + hit.guest + " is already bringing that." : "";
}
$("dish").addEventListener("input", checkDupe);

function render(statusText){ renderChips(); renderList(statusText); checkDupe(); }

async function load(){
  if (!configured) return;
  try {
    const r = await fetch(`${API}/dishes?select=${COLS}&order=created_at.asc`, { headers: HEADERS, cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    const data = await r.json();
    items = Array.isArray(data) ? data.filter(i => i && typeof i.dish === "string" && typeof i.guest === "string") : [];
    // forget ids that no longer exist (removed by the host)
    const live = new Set(items.map(i => i.id)); mine = new Set([...mine].filter(id => live.has(id))); lsSet("tg-mine", [...mine]);
    loaded = true; render();
  } catch (e) {
    if (!loaded) render("Can't reach the list right now. Check your connection and refresh.");
  }
}

$("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const msg = $("formMsg");
  if (!configured) { msg.className = "msg err"; msg.textContent = "This page isn't connected yet (host: see setup note above)."; return; }
  if (busy) return;
  const guest = clean($("guest").value, 60), dish = clean($("dish").value, 80);
  const category = CATS.includes($("category").value) ? $("category").value : "Other";
  if (!guest || !dish) { msg.className = "msg err"; msg.textContent = "Add your name and what you're bringing."; return; }
  busy = true; $("submit").disabled = true; msg.className = "msg"; msg.textContent = "Adding...";
  const id = uuid();
  try {
    const r = await fetch(`${API}/dishes`, {
      method: "POST",
      headers: { ...HEADERS, "Prefer": "return=minimal" },
      body: JSON.stringify({ id, guest, dish, category, owner_token: token })
    });
    if (!r.ok) throw new Error(r.status);
    mine.add(id); lsSet("tg-mine", [...mine]); lsSet("tg-name", guest);
    $("dish").value = "";
    msg.className = "msg ok"; msg.textContent = "Added! Thanks, " + guest + ".";
    await load();
  } catch (err) {
    msg.className = "msg err"; msg.textContent = "That didn't save. Check your connection and try again.";
  } finally { busy = false; $("submit").disabled = false; }
});

async function removeItem(id, btn){
  btn.disabled = true; btn.textContent = "Removing...";
  try {
    const r = await fetch(`${API}/rpc/remove_dish`, { method: "POST", headers: HEADERS, body: JSON.stringify({ p_id: id, p_token: token }) });
    if (!r.ok) throw new Error(r.status);
    mine.delete(id); lsSet("tg-mine", [...mine]);
    await load();
  } catch (e) { btn.disabled = false; btn.textContent = "Remove"; }
}

if (!configured) {
  $("setup").appendChild(el("p", "setup", "Host setup needed: open index.html and paste your Supabase Project URL and Publishable key into the two lines marked PASTE. Guests won't see this once it's connected."));
  loaded = true; render();
} else {
  render();
  load();
  setInterval(() => { if (!document.hidden) load(); }, 15000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
}
</script>
</body>
</html>
